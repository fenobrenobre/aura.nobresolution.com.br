<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressão de Documento</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #1f2937;
            margin: 0;
            padding: 0;
            line-height: 1.3;
        }
        .print-container {
            width: 210mm;
            min-height: 297mm;
            padding: 15mm 20mm;
            margin: 0 auto;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .prof-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .prof-logo {
            max-height: 60px;
            width: auto;
        }
        .prof-details h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
            text-transform: uppercase;
            color: #111827;
        }
        .prof-details p {
            font-size: 0.8rem;
            margin: 2px 0 0 0;
            color: #4b5563;
        }
        
        .doc-type {
            text-align: right;
        }
        .doc-type h1 {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .doc-date {
            font-size: 0.85rem;
            color: #6b7280;
        }

        /* Patient Info - SIMPLIFICADO */
        .patient-box {
            background-color: #f3f4f6;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 30px;
            border-left: 4px solid #3b82f6;
        }
        .patient-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #111827;
            margin: 0 0 4px 0;
        }
        .patient-details {
            color: #374151;
            font-size: 0.9rem;
            margin: 2px 0;
        }
        .patient-details strong {
            font-weight: 600;
            color: #1f2937;
        }
        
        .patient-metrics {
            display: flex;
            justify-content: flex-end; /* Prontuário à direita */
            margin-top: 4px;
            border-top: 1px solid #e5e7eb;
            padding-top: 6px;
        }
        .metric-item {
            font-size: 0.9rem;
            color: #374151;
        }
        .metric-item strong {
            font-weight: 600;
            color: #1f2937;
        }

        /* Content Body - RODAPÉ DINÂMICO */
        .content-body {
            /* flex-grow: 1; <-- REMOVIDO */
            display: flex;
            flex-direction: column;
            font-size: 1.05rem; 
            line-height: 1.6;
            text-align: justify;
            color: #1f2937;
            white-space: pre-wrap;
            margin-bottom: 30px;
        }

        /* Footer */
        footer {
            margin-top: 20px;
            text-align: center;
        }
        .signature-box {
            display: inline-block;
            padding-top: 10px;
            border-top: 1px solid #000;
            min-width: 250px;
            margin-bottom: 15px;
        }
        .sig-name {
            font-weight: 700;
            font-size: 0.95rem;
            margin: 0;
        }
        .sig-reg {
            font-size: 0.85rem;
            color: #4b5563;
            margin: 0;
        }
        .footer-address {
            font-size: 0.75rem;
            color: #9ca3af;
            border-top: 1px solid #e5e7eb;
            padding-top: 5px;
        }

        @media print {
            body { background: none; -webkit-print-color-adjust: exact; }
            .print-container { width: 100%; height: auto; margin: 0; padding: 0; box-shadow: none; min-height: auto; }
            header { margin-top: 0; } 
            footer { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="print-container">
        <header>
            <div class="prof-info">
                <img id="logo" class="prof-logo" style="display: none;">
                <div class="prof-details">
                    <h2 id="profName"></h2>
                    <p id="profSpecialty"></p>
                    <p id="profRegister"></p>
                </div>
            </div>
            <div class="doc-type">
                <h1 id="docType">DOCUMENTO</h1>
                <p class="doc-date" id="docDate"></p>
            </div>
        </header>

        <div class="patient-box">
            <p class="patient-name" id="patientName"></p>
            <p class="patient-details"><span id="patientAddress"></span></p>
            <p class="patient-details"><strong>CPF:</strong> <span id="patientCPF">---</span></p>
            
            <div class="patient-metrics">
                <span class="metric-item"><strong>Prontuário:</strong> #<span id="patientRecord">---</span></span>
            </div>
        </div>

        <div class="content-body" id="document-content">
            </div>

        <footer>
            <div class="signature-box">
                <p class="sig-name" id="sigName"></p>
                <p class="sig-reg" id="sigRegister"></p>
            </div>
            <div class="footer-address" id="footerAddress"></div>
        </footer>
    </div>

    <script>
        // Função auxiliar para buscar valor em múltiplos lugares
        function getVal(obj, keys) {
            for (let k of keys) {
                if (obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
            }
            return null;
        }

        window.onload = function() {
            const dataStr = sessionStorage.getItem('certificateToPrint');
            if (!dataStr) {
                document.body.innerHTML = '<p style="text-align:center; padding: 20px; color:red">Erro: Nenhum dado encontrado para impressão.</p>';
                return;
            }

            const data = JSON.parse(dataStr);
            const user = data.user || {};
            const patient = data.patient || {};
            const doc = data.document || {};

            // 1. Cabeçalho
            document.getElementById('profName').innerText = user.professionalName || user.name || 'Profissional';
            
            let professionText = user.profession || '';
            if (user.specialty) {
                professionText += (professionText ? ' - ' : '') + user.specialty;
            }
            document.getElementById('profSpecialty').innerText = professionText;
            document.getElementById('profRegister').innerText = user.professional_register || '';
            
            if (user.logo) {
                const img = document.getElementById('logo');
                img.src = user.logo;
                img.style.display = 'block';
            }

            // 2. Tipo e Data
            document.getElementById('docType').innerText = (doc.type || 'DOCUMENTO').toUpperCase();
            document.getElementById('docDate').innerText = doc.date || new Date().toLocaleDateString('pt-BR');

            // 3. Paciente
            document.getElementById('patientName').innerText = patient.name || 'Paciente';
            
            // Endereço: Tenta montar ou pegar pronto
            let addressText = 'Endereço não informado';
            if (patient.street) {
                addressText = `${patient.street}, ${patient.street_number || 'S/N'}`;
                if (patient.neighborhood) addressText += ` - ${patient.neighborhood}`;
                if (patient.city) addressText += ` - ${patient.city}/${patient.state || ''}`;
                if (patient.zip_code) addressText += ` (CEP: ${patient.zip_code})`;
            } else if (patient.full_address) {
                addressText = patient.full_address;
            }
            document.getElementById('patientAddress').innerText = addressText;

            // CPF: Tenta buscar em múltiplas chaves
            document.getElementById('patientCPF').innerText = getVal(patient, ['cpf', 'CPF', 'doc_cpf']) || 'Não informado';
            
            // Prontuário
            document.getElementById('patientRecord').innerText = patient.id || '---';

            // 4. Conteúdo
            document.getElementById('document-content').innerHTML = doc.final_content || doc.content || '<p>Sem conteúdo.</p>';

            // 5. Rodapé
            document.getElementById('sigName').innerText = user.professionalName || user.name;
            document.getElementById('sigRegister').innerText = user.professional_register || '';
            
            let footerAddr = `${user.street || ''}, ${user.street_number || ''}`;
            if (user.neighborhood) footerAddr += ` - ${user.neighborhood}`;
            if (user.city) footerAddr += ` - ${user.city}/${user.state || ''}`;
            if (user.phone) footerAddr += ` | Tel: ${user.phone}`;
            
            document.getElementById('footerAddress').innerText = footerAddr.replace(/^, /, '').replace(/ - \/$/, '');

            setTimeout(() => {
                window.print();
            }, 500);
        };
    </script>
</body>
</html>
