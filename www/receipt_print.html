<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recibo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            color: #1f2937;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            width: 800px;
            margin: 20px auto;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            padding: 40px;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .user-info {
            text-align: left;
        }
        .user-info img {
            max-height: 50px;
            width: auto;
            margin-bottom: 10px;
            display: none;
        }
        .user-info h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            color: #111827;
        }
        .user-info p {
            font-size: 0.9rem;
            color: #4b5563;
            margin: 2px 0;
        }
        .receipt-title {
            text-align: right;
        }
        .receipt-title h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .receipt-title p {
            font-size: 1rem;
            color: #6b7280;
            margin: 5px 0 0 0;
        }
        .content {
            font-size: 1rem;
            color: #374151;
            margin-bottom: 40px;
            text-align: justify;
            line-height: 1.8;
        }
        footer {
            margin-top: 50px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }
        .signature-line {
            width: 250px;
            border-top: 1px solid #111827;
            margin: 0 auto 10px auto;
        }
        .footer-info p {
            font-size: 0.85rem;
            color: #6b7280;
            margin: 2px 0;
        }

        @media print {
            body {
                background-color: #ffffff;
            }
            .container {
                width: 100%;
                margin: 0;
                border: none;
                box-shadow: none;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="user-info">
                <img id="user-logo" src="" alt="Logo">
                <h1 id="user-name">[Nome do Profissional]</h1>
                <p id="user-profession">[Profissão]</p>
                <p id="user-cpf">[CPF]</p>
            </div>
            <div class="receipt-title">
                <h2>Recibo</h2>
                <p>Nº <span id="receipt-number">0000/0000</span></p>
                <p id="receipt-date">[Data]</p>
            </div>
        </header>

        <div class="content" id="receipt-content">
            </div>

        <footer>
            <div class="signature-line"></div>
            <div class="footer-info">
                <p id="footer-name"><strong>[Nome do Profissional]</strong></p>
            </div>
        </footer>
    </div>

    <script>
        window.onload = function() {
            const dataString = sessionStorage.getItem('receiptToPrint');
            if (!dataString) {
                document.body.innerHTML = '<h1>Erro: Dados do recibo não encontrados. Feche esta janela e tente novamente.</h1>';
                return;
            }

            const data = JSON.parse(dataString);
            const user = data.user;
            const content = data.content;
            const receiptNumber = data.receipt_number;

            const logoImg = document.getElementById('user-logo');
            if (user.logo) {
                logoImg.src = user.logo;
                logoImg.style.display = 'block';
            } else {
                logoImg.style.display = 'none';
            }

            document.getElementById('user-name').innerText = user.professionalName || user.name;
            document.getElementById('footer-name').innerHTML = `<strong>${user.professionalName || user.name}</strong>`;
            
            // ** ATUALIZAÇÃO: Exibe Profissão + Especialidade **
            let professionText = user.profession || '';
            if (user.specialty) {
                professionText += (professionText ? ' - ' : '') + user.specialty;
            }
            document.getElementById('user-profession').innerText = professionText;
            
            document.getElementById('user-cpf').innerText = user.cpf ? `CPF: ${user.cpf}` : '';

            document.getElementById('receipt-number').innerText = receiptNumber || 'N/A';
            document.getElementById('receipt-date').innerText = new Date().toLocaleDateString('pt-BR');

            document.getElementById('receipt-content').innerHTML = content;

            setTimeout(() => {
                window.print();
            }, 500);
        };
    </script>
</body>
</html>
